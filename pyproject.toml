[project]
name = "manga-live-reader"
version = "0.3.0"
description = "만화 뷰어 화면을 캡처해 OCR + 번역 결과를 오버레이로 표시하는 읽기 도구"
requires-python = ">=3.11,<3.12"
# **선택이 아니다.** src/mtl_service/ctd 가 comic-text-detector(GPL-3.0)와
# YOLOv5 v6.x(GPL-3.0) 추론 코드의 벤더링본이고 서비스가 그것을 직접 import 한다.
# src/mtl_service/ctd/NOTICE.md 참조.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    # --- 서비스 ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20", # multipart/form-data 파싱
    # --- 이미지 ---
    "pillow>=11.0",
    "numpy>=1.26,<2.3",
    "opencv-python-headless>=4.10",
    # --- 추론 런타임 (Blackwell sm_120 → cu128 필수) ---
    "torch>=2.7",
    "torchvision>=0.22",
    # --- OCR ---
    "manga-ocr>=0.1.14",
    # --- comic-text-detector 후처리 의존성 ---
    "einops>=0.8",
    "shapely>=2.0",
    "pyclipper>=1.3",
    "anthropic>=0.120.0",
    "google-genai>=2.14.0",
    # OpenAI 호환. ChatGPT 와 로컬 엔드포인트(Ollama 등)가 같은 SDK 를 쓴다.
    "openai>=1.60",
]

# `[project]` 의 테이블은 배열 뒤에 온다 — 위에 두면 `dependencies` 가 이 테이블
# 안으로 들어간다 (실제로 한 번 그렇게 됐다).
[project.urls]
Homepage = "https://github.com/vanillapapaya/MangaLiveReader"
Issues = "https://github.com/vanillapapaya/MangaLiveReader/issues"

[project.optional-dependencies]
client = [
    "mss>=10.0",
    "PySide6>=6.8",
    "httpx>=0.28",
    "httpx-sse>=0.4",
]
# 윈도우 트레이 런처(scripts/tray.py). 기본 의존성에 넣지 않는 이유는 리눅스에서
# 쓸모가 없어서다 — WSL 로 개발할 때 X 백엔드를 끌고 들어온다.
launcher = [
    "pystray>=0.19",
]

[project.scripts]
mtl-service = "mtl_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtl_service", "src/mtl_client", "src/mtl_shared"]

# ---------------------------------------------------------------------------
# PyTorch 를 cu128 빌드로 고정한다.
#
# **처음 적어둔 이유는 지금 사실이 아니다.** "기본 PyPI 휠에는 sm_120 커널이
# 없다" 는 torch 2.7 시절(기본이 cu126) 이야기다. 2.11 의 기본 휠은 CUDA 13.0
# 의존이라(`cuda-toolkit==13.0.2`) sm_120 을 담고 있다. 고정을 풀어도 RTX 50 은
# 돈다.
#
# 그래도 고정을 유지하는 이유는 **재현성** 하나다. 풀어 두면 torch 가 오를
# 때마다 CUDA 판이 갈려서, 배포하고 나서 받은 날짜에 따라 되는 사람과 안 되는
# 사람이 갈린다. 실제로 재 본 조합에 묶어 둔다.
#
# 어느 쪽이든 담기는 아키는 sm_75(튜링) 이상이다. GTX 10 시리즈(sm_61)는 못
# 쓰고, CUDA 13 은 파스칼을 아예 뺐으니 고정을 풀어도 마찬가지다.
# `scripts/setup.ps1` 이 기동 전에 대조해서 알려 준다.
#
# NVIDIA 가 아닌 기계는 이 인덱스를 타면 안 된다 — 쓰지도 못할 CUDA 런타임을 몇 GB 씩
# 받는다. 런처가 `--no-install-package torch` 로 빼고 CPU 휠을 따로 깐다.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# src 레이아웃이라 명시가 필요하다. 테스트는 GPU·모델 없이 도는 것만 둔다 —
# 파이프라인 전체 검증은 scripts/debug_page.py 가 한다.
pythonpath = ["src"]
testpaths = ["tests"]
