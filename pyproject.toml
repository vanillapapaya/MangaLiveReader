[project]
name = "manga-live-reader"
version = "0.1.0"
description = "만화 뷰어 화면을 캡처해 OCR + 번역 결과를 오버레이로 표시하는 읽기 도구"
requires-python = ">=3.11,<3.12"
# **선택이 아니다.** src/mtl_service/ctd 가 comic-text-detector(GPL-3.0)와
# YOLOv5 v6.x(GPL-3.0) 추론 코드의 벤더링본이고 서비스가 그것을 직접 import 한다.
# src/mtl_service/ctd/NOTICE.md 참조.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    # --- 서비스 ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20", # multipart/form-data 파싱
    # --- 이미지 ---
    "pillow>=11.0",
    "numpy>=1.26,<2.3",
    "opencv-python-headless>=4.10",
    # --- 추론 런타임 (Blackwell sm_120 → cu128 필수) ---
    "torch>=2.7",
    "torchvision>=0.22",
    # --- OCR ---
    "manga-ocr>=0.1.14",
    # --- comic-text-detector 후처리 의존성 ---
    "einops>=0.8",
    "shapely>=2.0",
    "pyclipper>=1.3",
    "anthropic>=0.120.0",
    "google-genai>=2.14.0",
]

# `[project]` 의 테이블은 배열 뒤에 온다 — 위에 두면 `dependencies` 가 이 테이블
# 안으로 들어간다 (실제로 한 번 그렇게 됐다).
[project.urls]
Homepage = "https://github.com/vanillapapaya/MangaLiveReader"
Issues = "https://github.com/vanillapapaya/MangaLiveReader/issues"

[project.optional-dependencies]
client = [
    "mss>=10.0",
    "PySide6>=6.8",
    "httpx>=0.28",
    "httpx-sse>=0.4",
]

[project.scripts]
mtl-service = "mtl_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtl_service", "src/mtl_client", "src/mtl_shared"]

# ---------------------------------------------------------------------------
# PyTorch는 반드시 CUDA 12.8 빌드로. 기본 PyPI 휠에는 sm_120 커널이 없어
# RTX 5080에서 "no kernel image is available" 로 죽는다.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# src 레이아웃이라 명시가 필요하다. 테스트는 GPU·모델 없이 도는 것만 둔다 —
# 파이프라인 전체 검증은 scripts/debug_page.py 가 한다.
pythonpath = ["src"]
testpaths = ["tests"]
